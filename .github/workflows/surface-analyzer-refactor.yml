name: Surface Analyzer Refactor

on:
  push:
    branches:
      - surface-analyzer-refactor-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node adapter dependencies
        working-directory: surface-analyzer/node
        run: npm ci
      - name: Run Surface Analyzer regression harnesses
        shell: bash
        run: |
          set -euo pipefail
          for test in surface-analyzer/tests/*.cjs; do
            echo "==> $test"
            node "$test"
          done
